[package]
name = "aurorad"
version = "1.0.0"
edition = "2021"
authors = ["AuroraSU Team"]
description = "AuroraSU Userspace Daemon"
license = "GPL-2.0-or-later"
repository = "https://github.com/AuroraSU/AuroraSU"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
nix = { version = "0.28", features = ["user", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
libc = "0.2"
walkdir = "2.5"
tempfile = "3.10"
sha2 = "0.10"
hex = "0.4"
zip = "0.6"
reqwest = { version = "0.12", features = ["blocking"] }

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
