# =============================================================================
# build-phantom-module.yml
# =============================================================================
# Build OnePlus ACE5 (SM8650) Phantom Kernel Module (.ko)
# Target: Android GKI 6.1 ARM64
#
# Triggers:
#   - Push to master branch (when kernel_module/ files change)
#   - Manual workflow_dispatch with configurable kernel version
#   - Tag push (v*) for release creation
# =============================================================================

name: Build Phantom Module (SM8650)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'kernel_module/**'
      - '.github/workflows/build-phantom-module.yml'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'GKI kernel version (e.g. android14-6.1-lts)'
        required: false
        default: 'common-android14-6.1-lts'
        type: string
      clang_version:
        description: 'Clang toolchain version tag (e.g. clang-r536225)'
        required: false
        default: 'clang-r536225'
        type: string
      debug_level:
        description: 'Module debug level (0=none, 1=basic, 2=verbose)'
        required: false
        default: '0'
        type: string
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  KERNEL_MANIFEST_BRANCH: ${{ inputs.kernel_version || 'common-android14-6.1-lts' }}
  CLANG_VERSION: ${{ inputs.clang_version || 'clang-r536225' }}
  DEBUG_LEVEL: ${{ inputs.debug_level || '0' }}
  MODULE_NAME: phantom_module

jobs:
  # ===========================================================================
  # Job 1: Build the phantom_module.ko
  # ===========================================================================
  build-module:
    name: Build phantom_module.ko (SM8650)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Step 2: Install build dependencies
      # -----------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            openssl \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zlib1g-dev

      # -----------------------------------------------------------------------
      # Step 3: Cache kernel headers
      # -----------------------------------------------------------------------
      - name: Cache GKI kernel headers
        id: cache-kernel-headers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/gki-kernel-headers
          key: gki-headers-${{ env.KERNEL_MANIFEST_BRANCH }}-${{ hashFiles('kernel_module/Makefile') }}
          restore-keys: |
            gki-headers-${{ env.KERNEL_MANIFEST_BRANCH }}-

      # -----------------------------------------------------------------------
      # Step 4: Cache Clang toolchain
      # -----------------------------------------------------------------------
      - name: Cache Clang/LLVM toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/prebuilts/clang/host/linux-x86
          key: clang-toolchain-${{ env.CLANG_VERSION }}
          restore-keys: |
            clang-toolchain-

      # -----------------------------------------------------------------------
      # Step 5: Install repo tool
      # -----------------------------------------------------------------------
      - name: Install repo tool
        if: steps.cache-kernel-headers.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${GITHUB_WORKSPACE}/bin/repo"
          chmod +x "${GITHUB_WORKSPACE}/bin/repo"
          echo "${GITHUB_WORKSPACE}/bin" >> "${GITHUB_PATH}"

      # -----------------------------------------------------------------------
      # Step 6: Download GKI kernel source and extract headers
      # -----------------------------------------------------------------------
      - name: Download GKI kernel source
        if: steps.cache-kernel-headers.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          set -euxo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/android-kernel"
          cd "${GITHUB_WORKSPACE}/android-kernel"

          # Initialize repo for the specified GKI branch
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${KERNEL_MANIFEST_BRANCH}" \
            --depth=1

          # Sync only the common kernel (minimal clone for headers)
          repo sync \
            -c \
            -j"$(nproc --all)" \
            --fail-fast \
            --no-tags \
            --force-sync \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            --current-branch

      - name: Extract kernel headers
        if: steps.cache-kernel-headers.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          KERNEL_SRC="${GITHUB_WORKSPACE}/android-kernel/common"
          HEADERS_DIR="${GITHUB_WORKSPACE}/gki-kernel-headers"

          if [ ! -d "$KERNEL_SRC" ]; then
            echo "ERROR: Kernel source not found at $KERNEL_SRC"
            exit 1
          fi

          mkdir -p "$HEADERS_DIR"

          # Copy essential kernel headers for out-of-tree module compilation
          # Include directories needed by kbuild for external modules
          rsync -a --delete \
            --include='Makefile' \
            --include='Kconfig' \
            --include='arch/' \
            --include='arch/arm64/' \
            --include='arch/arm64/include/' \
            --include='arch/arm64/include/**' \
            --include='arch/arm64/lib/' \
            --include='arch/arm64/lib/**' \
            --include='arch/arm64/Makefile' \
            --include='arch/arm64/tools/' \
            --include='arch/arm64/tools/**' \
            --include='include/' \
            --include='include/**' \
            --include='scripts/' \
            --include='scripts/**' \
            --include='Module.symvers' \
            --include='tools/' \
            --include='tools/objtool/' \
            --include='tools/objtool/**' \
            --exclude='*.o' \
            --exclude='*.cmd' \
            --exclude='*.ko' \
            --exclude='*.mod' \
            --exclude='*.mod.c' \
            --exclude='*.order' \
            --exclude='*.symvers' \
            --exclude='.*' \
            "$KERNEL_SRC/" "$HEADERS_DIR/"

          # Ensure the output directory structure exists
          mkdir -p "$HEADERS_DIR/out/android14-6.1"

          # Generate a minimal Module.symvers if not present
          if [ ! -f "$HEADERS_DIR/Module.symvers" ]; then
            touch "$HEADERS_DIR/Module.symvers"
          fi

          echo "Kernel headers extracted to: $HEADERS_DIR"
          echo "Headers size: $(du -sh "$HEADERS_DIR" | cut -f1)"

      # -----------------------------------------------------------------------
      # Step 7: Download Android Clang/LLVM toolchain
      # -----------------------------------------------------------------------
      - name: Download Clang/LLVM toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          set -euxo pipefail

          CLANG_DIR="${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86"
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"

          mkdir -p "$CLANG_DIR"

          # Clone only the specific Clang version (shallow clone)
          git clone \
            --depth=1 \
            --single-branch \
            --branch "${CLANG_VERSION}" \
            "${CLANG_URL}" \
            "${CLANG_DIR}/${CLANG_VERSION}"

          echo "Clang toolchain downloaded to: ${CLANG_DIR}/${CLANG_VERSION}"

      # -----------------------------------------------------------------------
      # Step 8: Prepare build environment
      # -----------------------------------------------------------------------
      - name: Prepare build environment
        run: |
          set -euxo pipefail

          # Set up Clang toolchain path
          CLANG_DIR="${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86/${CLANG_VERSION}"
          CLANG_BIN="${CLANG_DIR}/bin"

          if [ ! -d "$CLANG_BIN" ]; then
            echo "ERROR: Clang bin not found at $CLANG_BIN"
            ls -la "${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86/" || true
            exit 1
          fi

          # Verify toolchain binaries
          echo "=== Toolchain verification ==="
          ls -la "$CLANG_BIN/clang" "$CLANG_BIN/llvm-ar" "$CLANG_BIN/llvm-nm" || true
          "$CLANG_BIN/clang" --version | head -5 || true

          # Export environment variables
          echo "CLANG_PATH=${CLANG_DIR}" >> "${GITHUB_ENV}"
          echo "CLANG_BIN=${CLANG_BIN}" >> "${GITHUB_ENV}"
          echo "PATH=${CLANG_BIN}:${PATH}" >> "${GITHUB_ENV}"

          # Verify kernel headers
          HEADERS_DIR="${GITHUB_WORKSPACE}/gki-kernel-headers"
          if [ ! -f "$HEADERS_DIR/Makefile" ]; then
            echo "ERROR: Kernel Makefile not found at $HEADERS_DIR"
            exit 1
          fi
          echo "Kernel headers OK: $HEADERS_DIR"

      # -----------------------------------------------------------------------
      # Step 9: Build the kernel module
      # -----------------------------------------------------------------------
      - name: Build phantom_module.ko
        id: build
        run: |
          set -exuo pipefail

          HEADERS_DIR="${GITHUB_WORKSPACE}/gki-kernel-headers"
          CLANG_BIN="${CLANG_PATH}/bin"
          MODULE_DIR="${GITHUB_WORKSPACE}/kernel_module"
          OUTPUT_DIR="${GITHUB_WORKSPACE}/build-output"

          mkdir -p "$OUTPUT_DIR"

          # Build command
          # Using Clang with aarch64-linux-gnu- cross prefix
          make -C "$MODULE_DIR" \
            KDIR="$HEADERS_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="${CLANG_BIN}/" \
            CC="${CLANG_BIN}/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD="${CLANG_BIN}/ld.lld" \
            AR="${CLANG_BIN}/llvm-ar" \
            NM="${CLANG_BIN}/llvm-nm" \
            OBJCOPY="${CLANG_BIN}/llvm-objcopy" \
            OBJDUMP="${CLANG_BIN}/llvm-objdump" \
            READELF="${CLANG_BIN}/llvm-readelf" \
            2>&1 | tee "${OUTPUT_DIR}/build.log"

          # Verify the output .ko file exists
          if [ -f "${MODULE_DIR}/phantom_module.ko" ]; then
            echo "BUILD_SUCCESS=true" >> "${GITHUB_ENV}"
            echo "=== Build successful ==="

            # Copy output
            cp "${MODULE_DIR}/phantom_module.ko" "${OUTPUT_DIR}/"

            # Module info
            echo "=== Module information ==="
            file "${OUTPUT_DIR}/phantom_module.ko"
            ls -lh "${OUTPUT_DIR}/phantom_module.ko"
            "${CLANG_BIN}/llvm-readelf" -h "${OUTPUT_DIR}/phantom_module.ko" || true
            "${CLANG_BIN}/llvm-objdump" -h "${OUTPUT_DIR}/phantom_module.ko" || true
          else
            echo "BUILD_SUCCESS=false" >> "${GITHUB_ENV}"
            echo "ERROR: phantom_module.ko not found after build!"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 10: Output error log on failure
      # -----------------------------------------------------------------------
      - name: Output error log on failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "  BUILD FAILED - Error Log Output"
          echo "=========================================="
          if [ -f "${GITHUB_WORKSPACE}/build-output/build.log" ]; then
            echo "--- Last 100 lines of build log ---"
            tail -100 "${GITHUB_WORKSPACE}/build-output/build.log"
          else
            echo "No build log found"
          fi

          # List kernel headers for debugging
          echo ""
          echo "--- Kernel headers directory ---"
          ls -la "${GITHUB_WORKSPACE}/gki-kernel-headers/" || echo "Headers dir not found"

          echo ""
          echo "--- Toolchain check ---"
          ls -la "${GITHUB_WORKSPACE}/prebuilts/clang/host/linux-x86/" || echo "Toolchain dir not found"

      # -----------------------------------------------------------------------
      # Step 11: Upload build artifact
      # -----------------------------------------------------------------------
      - name: Upload phantom_module.ko artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phantom-module-sm8650
          path: |
            ${{ github.workspace }}/build-output/phantom_module.ko
            ${{ github.workspace }}/build-output/build.log
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      # -----------------------------------------------------------------------
      # Step 12: Upload module symbols for debugging
      # -----------------------------------------------------------------------
      - name: Upload module symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phantom-module-symbols
          path: |
            ${{ github.workspace }}/kernel_module/*.o
            ${{ github.workspace }}/kernel_module/*.cmd
            ${{ github.workspace }}/kernel_module/Module.symvers
            ${{ github.workspace }}/kernel_module/modules.order
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7

  # ===========================================================================
  # Job 2: Create GitHub Release (only on tag push or manual trigger)
  # ===========================================================================
  release:
    name: Create Release
    needs: build-module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: phantom-module-sm8650
          path: ./release-artifacts

      - name: Prepare release assets
        run: |
          set -euxo pipefail

          # Determine version tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="manual-$(date +%Y%m%d-%H%M%S)"
          fi

          # Rename artifacts with descriptive names
          cd ./release-artifacts
          if [ -f "phantom_module.ko" ]; then
            mv phantom_module.ko "phantom_module-sm8650-${VERSION_TAG}.ko"
          fi

          echo "VERSION_TAG=${VERSION_TAG}" >> "${GITHUB_ENV}"
          echo "=== Release artifacts ==="
          ls -lh ./release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Phantom Module SM8650 - ${{ env.VERSION_TAG }}"
          body: |
            ## OnePlus ACE5 (SM8650) Phantom Kernel Module

            ### Build Information
            - **Device**: OnePlus ACE5 (Phantom)
            - **SoC**: Qualcomm SM8650 (Snapdragon 8 Gen 3)
            - **Target Kernel**: Android GKI 6.1 (ARM64)
            - **Kernel Branch**: `${{ env.KERNEL_MANIFEST_BRANCH }}`
            - **Clang Version**: `${{ env.CLANG_VERSION }}`
            - **Commit**: ${{ github.sha }}

            ### Files
            - `phantom_module-sm8650-*.ko` - Compiled kernel module

            ### Installation
            ```bash
            # Push to device
            adb push phantom_module-sm8650-*.ko /data/local/tmp/
            adb shell su -c "insmod /data/local/tmp/phantom_module-sm8650-*.ko"
            ```

            ### Verification
            ```bash
            adb shell su -c "cat /proc/phantom/info"
            adb shell su -c "lsmod | grep phantom"
            ```
          files: |
            ./release-artifacts/phantom_module-sm8650-*.ko
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
