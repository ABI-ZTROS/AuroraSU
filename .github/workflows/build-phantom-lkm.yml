# =============================================================================
# build-phantom-lkm.yml
# =============================================================================
# Build OnePlus ACE5 (SM8650) phantom_lkm Kernel Module (.ko)
# Target: Android GKI 6.1 ARM64
#
# Triggers:
#   - Push to master branch (when kernel_lkm/ directory changes)
#   - Manual workflow_dispatch with configurable parameters
#   - Tag push (v*) for automatic release creation
# =============================================================================

name: Build phantom_lkm (SM8650)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'kernel_lkm/**'
      - '.github/workflows/build-phantom-lkm.yml'
      - '.github/workflows/update-kernel-headers.yml'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'GKI kernel version manifest branch'
        required: false
        default: 'common-android14-6.1-lts'
        type: choice
        options:
          - 'common-android14-6.1-lts'
          - 'common-android14-6.1'
          - 'common-android15-6.6-lts'
          - 'common-android15-6.6'
      clang_version:
        description: 'Clang toolchain version'
        required: false
        default: 'clang-r536225'
        type: choice
        options:
          - 'clang-r536225'
          - 'clang-r530567'
          - 'clang-r522817'
          - 'clang-r510928'
      debug_level:
        description: 'Module debug level (0=none, 1=basic, 2=verbose)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: false
        type: boolean
      skip_cache:
        description: 'Skip cache and force re-download dependencies'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  packages: read

env:
  KERNEL_MANIFEST_BRANCH: ${{ inputs.kernel_version || 'common-android14-6.1-lts' }}
  CLANG_VERSION: ${{ inputs.clang_version || 'clang-r536225' }}
  DEBUG_LEVEL: ${{ inputs.debug_level || '0' }}
  MODULE_NAME: phantom_lkm
  MODULE_DIR: kernel_lkm
  OUTPUT_DIR: build-output
  HEADERS_DIR: gki-kernel-headers
  CLANG_DIR: prebuilts/clang/host/linux-x86

jobs:
  # ===========================================================================
  # Job 1: Build the phantom_lkm.ko module
  # ===========================================================================
  build-module:
    name: Build phantom_lkm.ko (SM8650)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      build_success: ${{ steps.build.outputs.build_success }}
      module_path: ${{ steps.build.outputs.module_path }}
      kernel_branch: ${{ env.KERNEL_MANIFEST_BRANCH }}
      clang_version: ${{ env.CLANG_VERSION }}

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # -----------------------------------------------------------------------
      # Step 2: Verify source directory exists
      # -----------------------------------------------------------------------
      - name: Verify source directory
        id: verify-source
        run: |
          echo "=== Verifying source directory ==="
          if [ ! -d "${{ github.workspace }}/${{ env.MODULE_DIR }}" ]; then
            echo "ERROR: Source directory ${{ env.MODULE_DIR }} not found!"
            echo "Available directories:"
            ls -la ${{ github.workspace }}/
            exit 1
          fi
          echo "Source directory verified: ${{ env.MODULE_DIR }}"
          ls -la ${{ github.workspace }}/${{ env.MODULE_DIR }}/

      # -----------------------------------------------------------------------
      # Step 3: Install build dependencies
      # -----------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          echo "=== Installing build dependencies ==="
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            openssl \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zlib1g-dev \
            file \
            ccache
          
          echo "=== Dependency versions ==="
          gcc --version | head -1
          python3 --version
          file --version | head -1

      # -----------------------------------------------------------------------
      # Step 4: Cache Clang toolchain
      # -----------------------------------------------------------------------
      - name: Cache Clang/LLVM toolchain
        if: ${{ inputs.skip_cache != true }}
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/${{ env.CLANG_DIR }}
          key: clang-toolchain-${{ env.CLANG_VERSION }}-${{ runner.os }}
          restore-keys: |
            clang-toolchain-${{ env.CLANG_VERSION }}-
            clang-toolchain-

      # -----------------------------------------------------------------------
      # Step 5: Download Android Clang toolchain
      # -----------------------------------------------------------------------
      - name: Download Android Clang toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true' || inputs.skip_cache == true
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          
          CLANG_PATH="${{ github.workspace }}/${{ env.CLANG_DIR }}"
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
          
          echo "=== Downloading Clang ${{ env.CLANG_VERSION }} ==="
          mkdir -p "$CLANG_PATH"
          
          # Clone only the specific Clang version (shallow clone)
          if [ -d "${CLANG_PATH}/${{ env.CLANG_VERSION }}" ]; then
            echo "Removing existing Clang directory..."
            rm -rf "${CLANG_PATH}/${{ env.CLANG_VERSION }}"
          fi
          
          git clone \
            --depth=1 \
            --single-branch \
            --branch "${{ env.CLANG_VERSION }}" \
            "${CLANG_URL}" \
            "${CLANG_PATH}/${{ env.CLANG_VERSION }}"
          
          echo "Clang toolchain downloaded successfully"
          ls -la "${CLANG_PATH}/${{ env.CLANG_VERSION }}/bin/" | head -20

      # -----------------------------------------------------------------------
      # Step 6: Verify Clang installation
      # -----------------------------------------------------------------------
      - name: Verify Clang installation
        run: |
          CLANG_BIN="${{ github.workspace }}/${{ env.CLANG_DIR }}/${{ env.CLANG_VERSION }}/bin"
          
          echo "=== Verifying Clang toolchain ==="
          if [ ! -f "${CLANG_BIN}/clang" ]; then
            echo "ERROR: clang not found at ${CLANG_BIN}/clang"
            ls -la "${CLANG_BIN}/" || true
            exit 1
          fi
          
          echo "Clang version:"
          "${CLANG_BIN}/clang" --version | head -3
          
          echo "LLVM tools:"
          ls -la "${CLANG_BIN}/llvm-ar" "${CLANG_BIN}/llvm-nm" "${CLANG_BIN}/ld.lld" || true

      # -----------------------------------------------------------------------
      # Step 7: Cache GKI kernel headers
      # -----------------------------------------------------------------------
      - name: Cache GKI kernel headers
        if: ${{ inputs.skip_cache != true }}
        id: cache-headers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/${{ env.HEADERS_DIR }}
          key: gki-headers-${{ env.KERNEL_MANIFEST_BRANCH }}-${{ hashFiles('kernel_lkm/Makefile') }}-${{ runner.os }}
          restore-keys: |
            gki-headers-${{ env.KERNEL_MANIFEST_BRANCH }}-
            gki-headers-

      # -----------------------------------------------------------------------
      # Step 8: Install repo tool (if cache miss)
      # -----------------------------------------------------------------------
      - name: Install repo tool
        if: steps.cache-headers.outputs.cache-hit != 'true' || inputs.skip_cache == true
        run: |
          echo "=== Installing repo tool ==="
          mkdir -p "${{ github.workspace }}/bin"
          curl -sL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${{ github.workspace }}/bin/repo"
          chmod +x "${{ github.workspace }}/bin/repo"
          echo "${{ github.workspace }}/bin" >> "${GITHUB_PATH}"
          repo --version

      # -----------------------------------------------------------------------
      # Step 9: Download GKI kernel headers
      # -----------------------------------------------------------------------
      - name: Download GKI kernel source
        if: steps.cache-headers.outputs.cache-hit != 'true' || inputs.skip_cache == true
        timeout-minutes: 30
        run: |
          set -euxo pipefail
          
          echo "=== Downloading GKI kernel source ==="
          echo "Manifest branch: ${{ env.KERNEL_MANIFEST_BRANCH }}"
          
          rm -rf "${{ github.workspace }}/android-kernel"
          mkdir -p "${{ github.workspace }}/android-kernel"
          cd "${{ github.workspace }}/android-kernel"
          
          # Initialize repo for the specified GKI branch
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${{ env.KERNEL_MANIFEST_BRANCH }}" \
            --depth=1
          
          # Sync only the common kernel (minimal clone for headers)
          repo sync \
            -c \
            -j"$(nproc --all)" \
            --fail-fast \
            --no-tags \
            --force-sync \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            --current-branch
          
          echo "Kernel source synced successfully"
          ls -la "${{ github.workspace }}/android-kernel/"

      # -----------------------------------------------------------------------
      # Step 10: Extract kernel headers
      # -----------------------------------------------------------------------
      - name: Extract kernel headers
        if: steps.cache-headers.outputs.cache-hit != 'true' || inputs.skip_cache == true
        run: |
          set -euxo pipefail
          
          KERNEL_SRC="${{ github.workspace }}/android-kernel/common"
          HEADERS_PATH="${{ github.workspace }}/${{ env.HEADERS_DIR }}"
          
          echo "=== Extracting kernel headers ==="
          
          if [ ! -d "$KERNEL_SRC" ]; then
            echo "ERROR: Kernel source not found at $KERNEL_SRC"
            echo "Available directories:"
            ls -la "${{ github.workspace }}/android-kernel/" || true
            exit 1
          fi
          
          rm -rf "$HEADERS_PATH"
          mkdir -p "$HEADERS_PATH"
          
          # Copy essential kernel headers for out-of-tree module compilation
          echo "Copying kernel headers..."
          rsync -a --delete \
            --include='Makefile' \
            --include='Kconfig' \
            --include='Kbuild' \
            --include='arch/' \
            --include='arch/arm64/' \
            --include='arch/arm64/include/' \
            --include='arch/arm64/include/**' \
            --include='arch/arm64/lib/' \
            --include='arch/arm64/lib/**' \
            --include='arch/arm64/Makefile' \
            --include='arch/arm64/kernel/' \
            --include='arch/arm64/kernel/asm-offsets.s' \
            --include='arch/arm64/tools/' \
            --include='arch/arm64/tools/**' \
            --include='include/' \
            --include='include/**' \
            --include='scripts/' \
            --include='scripts/**' \
            --include='tools/' \
            --include='tools/objtool/' \
            --include='tools/objtool/**' \
            --include='Module.symvers' \
            --exclude='*.o' \
            --exclude='*.cmd' \
            --exclude='*.ko' \
            --exclude='*.mod' \
            --exclude='*.mod.c' \
            --exclude='*.order' \
            --exclude='.git' \
            --exclude='.tmp_*' \
            "$KERNEL_SRC/" "$HEADERS_PATH/"
          
          # Ensure output directory structure exists
          mkdir -p "$HEADERS_PATH/out"
          
          # Generate a minimal Module.symvers if not present
          if [ ! -f "$HEADERS_PATH/Module.symvers" ]; then
            touch "$HEADERS_PATH/Module.symvers"
          fi
          
          echo "Kernel headers extracted successfully"
          echo "Headers size: $(du -sh "$HEADERS_PATH" | cut -f1)"
          echo "Headers location: $HEADERS_PATH"

      # -----------------------------------------------------------------------
      # Step 11: Verify kernel headers integrity
      # -----------------------------------------------------------------------
      - name: Verify kernel headers integrity
        run: |
          HEADERS_PATH="${{ github.workspace }}/${{ env.HEADERS_DIR }}"
          
          echo "=== Verifying kernel headers integrity ==="
          
          # Check essential files
          REQUIRED_FILES=(
            "Makefile"
            "arch/arm64/Makefile"
            "arch/arm64/include/asm/types.h"
            "include/linux/module.h"
            "include/linux/kernel.h"
            "scripts/Makefile.modpost"
          )
          
          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$HEADERS_PATH/$file" ]; then
              echo "ERROR: Missing required file: $file"
              MISSING=$((MISSING + 1))
            else
              echo "OK: $file"
            fi
          done
          
          if [ $MISSING -gt 0 ]; then
            echo "ERROR: $MISSING required files are missing!"
            echo "Headers directory contents:"
            ls -la "$HEADERS_PATH/"
            exit 1
          fi
          
          echo "Kernel headers integrity check passed"

      # -----------------------------------------------------------------------
      # Step 12: Prepare build environment
      # -----------------------------------------------------------------------
      - name: Prepare build environment
        run: |
          set -euxo pipefail
          
          CLANG_BIN="${{ github.workspace }}/${{ env.CLANG_DIR }}/${{ env.CLANG_VERSION }}/bin"
          
          echo "=== Preparing build environment ==="
          
          # Export environment variables
          echo "CLANG_PATH=${{ github.workspace }}/${{ env.CLANG_DIR }}/${{ env.CLANG_VERSION }}" >> "${GITHUB_ENV}"
          echo "CLANG_BIN=${CLANG_BIN}" >> "${GITHUB_ENV}"
          echo "PATH=${CLANG_BIN}:${PATH}" >> "${GITHUB_ENV}"
          
          # Set up ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "${GITHUB_ENV}"
          mkdir -p "${{ github.workspace }}/.ccache"
          
          echo "Build environment prepared"
          echo "CLANG_PATH: ${{ github.workspace }}/${{ env.CLANG_DIR }}/${{ env.CLANG_VERSION }}"
          echo "PATH updated with: ${CLANG_BIN}"

      # -----------------------------------------------------------------------
      # Step 13: Build the kernel module
      # -----------------------------------------------------------------------
      - name: Build phantom_lkm.ko
        id: build
        run: |
          set -exuo pipefail
          
          HEADERS_PATH="${{ github.workspace }}/${{ env.HEADERS_DIR }}"
          CLANG_BIN="${{ env.CLANG_BIN }}"
          MODULE_PATH="${{ github.workspace }}/${{ env.MODULE_DIR }}"
          OUTPUT_PATH="${{ github.workspace }}/${{ env.OUTPUT_DIR }}"
          
          echo "=== Building phantom_lkm.ko ==="
          echo "Headers: $HEADERS_PATH"
          echo "Module dir: $MODULE_PATH"
          echo "Clang: $CLANG_BIN"
          
          mkdir -p "$OUTPUT_PATH"
          
          # Verify Makefile exists
          if [ ! -f "$MODULE_PATH/Makefile" ]; then
            echo "ERROR: Makefile not found in $MODULE_PATH"
            ls -la "$MODULE_PATH/"
            exit 1
          fi
          
          # Build command with detailed logging
          make -C "$MODULE_PATH" \
            KDIR="$HEADERS_PATH" \
            ARCH=arm64 \
            CROSS_COMPILE="${CLANG_BIN}/aarch64-linux-gnu-" \
            CC="${CLANG_BIN}/clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD="${CLANG_BIN}/ld.lld" \
            AR="${CLANG_BIN}/llvm-ar" \
            NM="${CLANG_BIN}/llvm-nm" \
            OBJCOPY="${CLANG_BIN}/llvm-objcopy" \
            OBJDUMP="${CLANG_BIN}/llvm-objdump" \
            READELF="${CLANG_BIN}/llvm-readelf" \
            STRIP="${CLANG_BIN}/llvm-strip" \
            DEBUG_LEVEL="${{ env.DEBUG_LEVEL }}" \
            V=1 \
            2>&1 | tee "${OUTPUT_PATH}/build.log"
          
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT_CODE -eq 0 ] && [ -f "${MODULE_PATH}/phantom_lkm.ko" ]; then
            echo "build_success=true" >> "${GITHUB_OUTPUT}"
            echo "module_path=${MODULE_PATH}/phantom_lkm.ko" >> "${GITHUB_OUTPUT}"
            
            # Copy output
            cp "${MODULE_PATH}/phantom_lkm.ko" "${OUTPUT_PATH}/"
            
            echo "=== Build successful ==="
            ls -lh "${OUTPUT_PATH}/phantom_lkm.ko"
          else
            echo "build_success=false" >> "${GITHUB_OUTPUT}"
            echo "ERROR: Build failed with exit code $BUILD_EXIT_CODE"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Step 14: Verify module format (ARM64)
      # -----------------------------------------------------------------------
      - name: Verify module format
        run: |
          OUTPUT_PATH="${{ github.workspace }}/${{ env.OUTPUT_DIR }}"
          MODULE_FILE="${OUTPUT_PATH}/phantom_lkm.ko"
          
          echo "=== Verifying module format ==="
          
          if [ ! -f "$MODULE_FILE" ]; then
            echo "ERROR: Module file not found: $MODULE_FILE"
            exit 1
          fi
          
          # Check file type
          echo "File type:"
          file "$MODULE_FILE"
          
          # Verify it's an ARM64 kernel module
          FILE_INFO=$(file "$MODULE_FILE")
          if ! echo "$FILE_INFO" | grep -q "ARM aarch64"; then
            echo "ERROR: Module is not ARM64 format!"
            echo "Expected: ARM aarch64 kernel module"
            echo "Got: $FILE_INFO"
            exit 1
          fi
          
          if ! echo "$FILE_INFO" | grep -q "relocatable"; then
            echo "WARNING: Module may not be properly relocatable"
          fi
          
          # Additional verification with readelf
          echo ""
          echo "ELF header info:"
          "${{ env.CLANG_BIN }}/llvm-readelf" -h "$MODULE_FILE" | head -20
          
          echo ""
          echo "Module sections:"
          "${{ env.CLANG_BIN }}/llvm-objdump" -h "$MODULE_FILE" | head -30
          
          echo ""
          echo "Module format verification passed"

      # -----------------------------------------------------------------------
      # Step 15: Output error log on failure
      # -----------------------------------------------------------------------
      - name: Output error log on failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "  BUILD FAILED - Diagnostic Information"
          echo "=========================================="
          
          OUTPUT_PATH="${{ github.workspace }}/${{ env.OUTPUT_DIR }}"
          
          if [ -f "${OUTPUT_PATH}/build.log" ]; then
            echo ""
            echo "--- Last 150 lines of build log ---"
            tail -150 "${OUTPUT_PATH}/build.log"
          else
            echo "No build log found at ${OUTPUT_PATH}/build.log"
          fi
          
          echo ""
          echo "--- Environment Information ---"
          echo "Kernel branch: ${{ env.KERNEL_MANIFEST_BRANCH }}"
          echo "Clang version: ${{ env.CLANG_VERSION }}"
          echo "Working directory: ${{ github.workspace }}"
          
          echo ""
          echo "--- Kernel headers directory ---"
          ls -la "${{ github.workspace }}/${{ env.HEADERS_DIR }}/" 2>/dev/null || echo "Headers dir not found"
          
          echo ""
          echo "--- Toolchain directory ---"
          ls -la "${{ github.workspace }}/${{ env.CLANG_DIR }}/" 2>/dev/null || echo "Toolchain dir not found"
          
          echo ""
          echo "--- Common issues and suggestions ---"
          echo "1. If 'linux/compiler.h' is missing, headers may be incomplete"
          echo "2. If linker errors occur, check CLANG_TRIPLE setting"
          echo "3. For 'undefined reference' errors, check kernel version compatibility"
          echo "4. Try running with 'skip_cache: true' to refresh dependencies"

      # -----------------------------------------------------------------------
      # Step 16: Upload build artifact
      # -----------------------------------------------------------------------
      - name: Upload phantom_lkm.ko artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phantom_lkm-sm8650-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/${{ env.OUTPUT_DIR }}/phantom_lkm.ko
            ${{ github.workspace }}/${{ env.OUTPUT_DIR }}/build.log
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      # -----------------------------------------------------------------------
      # Step 17: Upload module symbols for debugging
      # -----------------------------------------------------------------------
      - name: Upload module symbols
        if: success() && env.DEBUG_LEVEL != '0'
        uses: actions/upload-artifact@v4
        with:
          name: phantom_lkm-symbols-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/${{ env.MODULE_DIR }}/*.o
            ${{ github.workspace }}/${{ env.MODULE_DIR }}/*.cmd
            ${{ github.workspace }}/${{ env.MODULE_DIR }}/Module.symvers
            ${{ github.workspace }}/${{ env.MODULE_DIR }}/modules.order
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7

  # ===========================================================================
  # Job 2: Create GitHub Release (only on tag push or manual trigger)
  # ===========================================================================
  release:
    name: Create GitHub Release
    needs: build-module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() && 
      needs.build-module.outputs.build_success == 'true' && 
      (startsWith(github.ref, 'refs/tags/v') || 
       (github.event_name == 'workflow_dispatch' && inputs.create_release == true))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: phantom_lkm-sm8650-${{ github.run_id }}
          path: ./release-artifacts

      - name: Prepare release assets
        run: |
          set -euxo pipefail
          
          # Determine version tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="manual-$(date +%Y%m%d-%H%M%S)"
          fi
          
          # Rename artifacts with descriptive names
          cd ./release-artifacts
          if [ -f "phantom_lkm.ko" ]; then
            mv phantom_lkm.ko "phantom_lkm-sm8650-${VERSION_TAG}.ko"
          fi
          
          # Generate checksums
          sha256sum *.ko > SHA256SUMS.txt
          
          echo "VERSION_TAG=${VERSION_TAG}" >> "${GITHUB_ENV}"
          echo "=== Release artifacts ==="
          ls -lh ./release-artifacts/
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "phantom_lkm SM8650 - ${{ env.VERSION_TAG }}"
          body: |
            ## OnePlus ACE5 (SM8650) phantom_lkm Kernel Module

            ### Build Information
            - **Device**: OnePlus ACE5 (Phantom)
            - **SoC**: Qualcomm SM8650 (Snapdragon 8 Gen 3)
            - **Target Kernel**: Android GKI 6.1 (ARM64)
            - **Kernel Branch**: `${{ needs.build-module.outputs.kernel_branch }}`
            - **Clang Version**: `${{ needs.build-module.outputs.clang_version }}`
            - **Commit**: ${{ github.sha }}
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'N/A' }}

            ### Files
            | File | Description |
            |------|-------------|
            | `phantom_lkm-sm8650-*.ko` | Compiled kernel module |
            | `SHA256SUMS.txt` | Checksums for verification |

            ### Installation
            ```bash
            # Push to device
            adb push phantom_lkm-sm8650-*.ko /data/local/tmp/
            
            # Load module (requires root)
            adb shell su -c "insmod /data/local/tmp/phantom_lkm-sm8650-*.ko"
            
            # Verify module loaded
            adb shell su -c "lsmod | grep phantom"
            adb shell su -c "cat /proc/phantom/info"
            ```

            ### Verification
            ```bash
            # Check module info
            adb shell su -c "cat /proc/phantom/info"
            
            # Check module status
            adb shell su -c "cat /proc/phantom/status"
            
            # View kernel log
            adb shell su -c "dmesg | grep phantom"
            ```

            ### Notes
            - This module is specifically built for OnePlus ACE5 (SM8650)
            - Requires Android GKI 6.1 kernel
            - Compatible with KernelSU/AuroraSU environments
          files: |
            ./release-artifacts/phantom_lkm-sm8650-*.ko
            ./release-artifacts/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Job 3: Cleanup on failure
  # ===========================================================================
  cleanup:
    name: Cleanup on failure
    needs: build-module
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Log cleanup notice
        run: |
          echo "Build failed. Check the 'Output error log on failure' step in the build-module job for details."
          echo "Common issues:"
          echo "  - Missing kernel headers: Try triggering with 'skip_cache: true'"
          echo "  - Clang version mismatch: Check the clang_version input parameter"
          echo "  - Makefile errors: Verify kernel_lkm/Makefile is valid"
