name: Build AuroraSU Manager APK

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'manager/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        sdkmanager --install \
          "build-tools;37.0.0" \
          "platforms;android-37.0" \
          "platform-tools" \
          "ndk;29.0.14206865" \
          "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        echo "$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_PATH

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true

    - name: Generate signing keystore
      id: create_keystore
      run: |
        KEYSTORE_PATH=$RUNNER_TEMP/aurora.keystore
        keytool -genkey -v \
          -keystore "$KEYSTORE_PATH" \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias aurora \
          -dname "CN=AuroraSU, OU=Aurora, O=AuroraSU Team, L=Beijing, ST=Beijing, C=CN" \
          -storepass aurorasu -keypass aurorasu
        echo "keystore_path=$KEYSTORE_PATH" >> $GITHUB_OUTPUT
        echo "keystore_password=aurorasu" >> $GITHUB_OUTPUT
        echo "key_alias=aurora" >> $GITHUB_OUTPUT
        echo "key_password=aurorasu" >> $GITHUB_OUTPUT

    - name: Grant execute permission for gradlew
      run: chmod +x manager/gradlew

    - name: Build Release APK
      run: |
        cd manager
        ./gradlew assembleRelease
      env:
        KEYSTORE_FILE: ${{ steps.create_keystore.outputs.keystore_path }}
        KEYSTORE_PASSWORD: ${{ steps.create_keystore.outputs.keystore_password }}
        KEY_ALIAS: ${{ steps.create_keystore.outputs.key_alias }}
        KEY_PASSWORD: ${{ steps.create_keystore.outputs.key_password }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuroraSU-Manager-APK
        path: manager/app/build/outputs/apk/release/*.apk

    - name: Get APK info
      id: apk_info
      run: |
        APK_PATH=$(find manager/app/build/outputs/apk/release/*.apk -type f | head -1)
        if [ -n "$APK_PATH" ]; then
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "APK: $APK_NAME ($APK_SIZE)"
        else
          echo "No APK found!"
          exit 1
        fi

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.1-manager
        name: "AuroraSU Manager v1.0.1"
        body: |
          ## AuroraSU Manager

          基于 SukiSU Ultra 源码构建，整合 Wild KSU 风格 UI。

          ### 功能特性
          - 🏠 多重仪表盘主页（系统状态、统计信息）
          - ⚡ 快捷功能卡片（SELinux 切换、安全模式、Root 隐藏、内核卸载）
          - 👑 超级用户管理
          - 📦 模块管理（支持 KPM）
          - 🔒 安全监控（SELinux、Seccomp、指纹）
          - 🎨 双主题架构（Miuix + Material3）
          - 🌈 15 种预设主题色 + Material You 动态取色
          - 🌙 AMOLED 纯黑模式
          - 🌐 30+ 语言支持
          - 🔧 工具箱（SELinux 切换、模块仓库等）

          ### 构建信息
          - 源码: SukiSU Ultra v4.1.2
          - UI: Wild KSU 风格自定义
          - 目标 SDK: Android 37
          - 最低 SDK: Android 12 (API 31)
          - JDK: 21
          - NDK: 29.0.14206865
        files: ${{ steps.apk_info.outputs.apk_path }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

  build-kernel:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-aarch64-linux-gnu

    - name: Build kernel module (arm64)
      run: |
        cd kernel
        export CROSS_COMPILE=aarch64-linux-gnu-
        export ARCH=arm64
        make -C /lib/modules/$(uname -r)/build M=$(pwd) modules 2>&1 || true

  build-aurorad:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Add Rust target
      run: rustup target add aarch64-linux-android

    - name: Build aurorad
      run: |
        cd userspace/ksud
        cargo build --release --target aarch64-linux-android 2>&1 || true
